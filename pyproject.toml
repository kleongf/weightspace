[project]
name = "weightspace"
version = "0.0.0"
description = "A lab for testing weight-space programming on small models."
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.2.0",
    "mlx-lm>=0.32.2",
    "numpy>=2.5.5",
]

[project.scripts]
ws = "weightspace.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: runs the real Target (minutes); select with -m slow"]
